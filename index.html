<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Portal Cek Pajak - Popup Mode</title>
    <style>
        /* ============================================
                   CSS VARIABLES & RESET
                ============================================ */
        :root {
            --bg-primary: #f0f4f8;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --border-color: #e8edf2;
            --card-hover: #f8faff;
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --border-color: #30363d;
            --card-hover: #1c2333;
            --header-gradient: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            /* Mencegah scroll halaman utama */;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ============================================
                   HEADER - COMPACT
                ============================================ */
        .header {
            background: var(--header-gradient);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            pointer-events: none;
        }

        .logo {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.3px;
        }

        .logo h1 span {
            font-weight: 300;
            opacity: 0.6;
            font-size: 14px;
        }

        .logo p {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 300;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-badge span {
            font-weight: 700;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(20deg) scale(1.05);
        }

        /* ============================================
                   GRID CONTROLS - COMPACT
                ============================================ */
        .grid-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
            margin: 8px 0 6px 0;
        }

        .grid-controls .filter-label {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .grid-controls .filter-label input {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 12px;
            width: 160px;
            transition: var(--transition);
            outline: none;
            height: 30px;
        }

        .grid-controls .filter-label input:focus {
            border-color: #302b63;
            box-shadow: 0 0 0 3px rgba(48, 43, 99, 0.12);
        }

        .grid-controls .filter-label .kode-filter {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .grid-controls .filter-label .kode-filter .kode-btn {
            padding: 2px 10px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            transition: var(--transition);
            height: 26px;
        }

        .grid-controls .filter-label .kode-filter .kode-btn:hover {
            border-color: #302b63;
            background: var(--card-hover);
        }

        .grid-controls .filter-label .kode-filter .kode-btn.active {
            background: var(--header-gradient);
            color: white;
            border-color: transparent;
        }

        .grid-controls .view-toggle {
            display: flex;
            gap: 4px;
        }

        .grid-controls .view-toggle button {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            transition: var(--transition);
            height: 28px;
        }

        .grid-controls .view-toggle button.active {
            background: var(--header-gradient);
            color: white;
            border-color: transparent;
        }

        .grid-controls .view-toggle button:hover:not(.active) {
            border-color: var(--text-primary);
        }

        /* ============================================
                   PROVINCE GRID - FILL AVAILABLE SPACE
                ============================================ */
        .province-grid-wrapper {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            /* Mencegah overflow */;
        }

        .province-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            height: 100%;
            align-content: start;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Scrollbar tipis */
        .province-grid::-webkit-scrollbar {
            width: 4px;
        }
        .province-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .province-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .province-grid.list-view {
            grid-template-columns: 1fr 1fr;
        }

        .province-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .province-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            border-color: #302b63;
        }

        .province-card:active {
            transform: scale(0.97);
        }

        .province-card .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .province-card .card-header .emoji {
            font-size: 24px;
            line-height: 1;
        }

        .province-card .card-header .name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .province-card .card-header .badge {
            font-size: 8px;
            padding: 1px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: #e8f0fe;
            color: #1a73e8;
            margin-left: auto;
            flex-shrink: 0;
        }

        [data-theme="dark"] .province-card .card-header .badge {
            background: #1a2332;
            color: #58a6ff;
        }

        .province-card .kode-nopol {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 6px 0;
            padding: 4px 12px;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }

        .province-card .kode-nopol .label {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .province-card .kode-nopol .kode {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            background: var(--bg-card);
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .province-card .kode-nopol .kode small {
            font-size: 10px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .province-card .card-body .desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .province-card .card-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .province-card .card-footer .popup-btn {
            background: var(--header-gradient);
            color: white;
            border: none;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .province-card .card-footer .popup-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(48, 43, 99, 0.3);
        }

        .province-card .card-footer .shortcut {
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.4;
            font-family: monospace;
        }

        /* ============================================
                   HISTORY - COMPACT
                ============================================ */
        .history-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 8px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            margin-top: 6px;
            max-height: 60px;
            overflow: hidden;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-header h3 {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }

        .history-header .clear-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .history-header .clear-btn:hover {
            background: rgba(220, 53, 69, 0.08);
        }

        .history-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
            max-height: 28px;
            overflow-y: auto;
        }

        .history-list .chip {
            background: var(--bg-primary);
            padding: 2px 12px;
            border-radius: 16px;
            font-size: 10px;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-list .chip:hover {
            border-color: #302b63;
            transform: scale(1.03);
        }

        .history-list .chip .remove {
            color: #dc3545;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        .history-list .chip .remove:hover {
            transform: scale(1.2);
        }

        .history-empty {
            color: var(--text-secondary);
            font-size: 11px;
            opacity: 0.5;
        }

        /* ============================================
                   TOAST
                ============================================ */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 360px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast .icon {
            font-size: 20px;
        }

        .toast .msg {
            font-size: 13px;
            color: var(--text-primary);
        }

        .toast .msg small {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* ============================================
                   RESPONSIVE
                ============================================ */
        @media (max-width: 1024px) {
            .province-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 8px;
            }
            .province-card {
                padding: 12px 14px;
            }
            .province-card .card-header .name {
                font-size: 13px;
            }
            .province-card .kode-nopol .kode {
                font-size: 14px;
            }
            .province-card .kode-nopol .kode small {
                font-size: 9px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .header {
                padding: 10px 14px;
                flex-direction: column;
                text-align: center;
                gap: 4px;
            }
            .logo h1 {
                font-size: 17px;
                justify-content: center;
            }
            .logo h1 span {
                font-size: 12px;
            }
            .logo p {
                font-size: 10px;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }
            .stats-badge {
                font-size: 10px;
                padding: 3px 12px;
            }

            .grid-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
                margin: 4px 0;
            }
            .grid-controls .filter-label {
                justify-content: center;
                flex-wrap: wrap;
            }
            .grid-controls .filter-label input {
                width: 100%;
                max-width: 200px;
                height: 28px;
                font-size: 11px;
            }
            .grid-controls .filter-label .kode-filter {
                justify-content: center;
            }
            .grid-controls .filter-label .kode-filter .kode-btn {
                font-size: 9px;
                padding: 1px 8px;
                height: 22px;
            }
            .grid-controls .view-toggle {
                justify-content: center;
            }

            .province-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 6px;
            }
            .province-grid.list-view {
                grid-template-columns: 1fr;
            }

            .province-card {
                padding: 10px 12px;
            }
            .province-card .card-header .emoji {
                font-size: 20px;
            }
            .province-card .card-header .name {
                font-size: 12px;
            }
            .province-card .card-header .badge {
                font-size: 7px;
                padding: 1px 8px;
            }
            .province-card .kode-nopol {
                padding: 3px 10px;
                margin: 3px 0 4px 0;
            }
            .province-card .kode-nopol .label {
                font-size: 8px;
            }
            .province-card .kode-nopol .kode {
                font-size: 13px;
                padding: 0 8px;
            }
            .province-card .kode-nopol .kode small {
                font-size: 8px;
            }
            .province-card .card-body .desc {
                font-size: 10px;
                -webkit-line-clamp: 2;
            }
            .province-card .card-footer .popup-btn {
                font-size: 10px;
                padding: 4px 12px;
            }
            .province-card .card-footer .shortcut {
                font-size: 9px;
            }

            .history-section {
                padding: 6px 12px;
                max-height: 50px;
            }
            .history-header h3 {
                font-size: 11px;
            }
            .history-list {
                max-height: 24px;
            }
            .history-list .chip {
                font-size: 9px;
                padding: 1px 10px;
            }

            .toast {
                left: 16px;
                right: 16px;
                bottom: 16px;
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            .province-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 5px;
            }
            .province-card .card-header .name {
                font-size: 11px;
            }
            .province-card .kode-nopol .kode {
                font-size: 11px;
            }
            .province-card .kode-nopol .kode small {
                display: none;
            }
            .province-card .card-footer .popup-btn {
                font-size: 9px;
                padding: 3px 10px;
            }
        }
    </style>
</head>

                kode: 'D, E, F, T, Z',
                kodeDesc: 'Bandung, Bekasi, Bogor',
                url: 'https://bapenda.jabarprov.go.id/infopkb/',
                desc: 'Info PKB Jawa Barat',
                shortcut: '9'
            }, {
                id: 10,
                name: 'Sumatera Selatan',
                emoji: '🟩',
                kode: 'BG',
                kodeDesc: 'Palembang',
                url: 'https://bapenda.sumselprov.go.id/infopajak',
                desc: 'Info pajak kendaraan Sumsel',
                shortcut: '0'
            }, {
                id: 11,
                name: 'Kepulauan Riau',
                emoji: '🛳️',
                kode: 'BP',
                kodeDesc: 'Batam, Tanjungpinang',
                url: 'https://bapenda.kepriprov.go.id/info-pajak',
                desc: 'Info pajak kendaraan Kepri',
                shortcut: 'q'
            }, {
                id: 12,
                name: 'Sulawesi Tengah',
                emoji: '🏔️',
                kode: 'DN',
                kodeDesc: 'Palu',
                url: 'https://bapenda.sultengprov.go.id/pkb',
                desc: 'Info pajak kendaraan Sulteng',
                shortcut: 'w'
            }, {
                id: 13,
                name: 'Bengkulu',
                emoji: '🌴',
                kode: 'BD',
                kodeDesc: 'Bengkulu',
                url: 'https://pusako.bengkuluprov.go.id/infopajak',
                desc: 'Info pajak kendaraan Bengkulu',
                shortcut: 'e'
            }, {
                id: 14,
                name: 'Sulawesi Utara',
                emoji: '🌊',
                kode: 'DB',
                kodeDesc: 'Manado',
                url: 'https://bapenda.sulutprov.go.id/cekpajak',
                desc: 'Info pajak kendaraan Sulut',
                shortcut: 'r'
            }];

            // ============================================
            // STATE
            // ============================================
            let currentView = 'grid';
            let searchQuery = '';
            let activeKode = '';
            let history = JSON.parse(localStorage.getItem('popupHistory') || '[]');
            let darkMode = localStorage.getItem('darkModePopup') === 'true';
            let toastTimeout = null;

            // ============================================
            // DOM REFS
            // ============================================
            const grid = document.getElementById('provinceGrid');
            const searchInput = document.getElementById('searchInput');
            const kodeFilter = document.getElementById('kodeFilter');
            const viewButtons = document.querySelectorAll('.view-toggle button');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistory');
            const themeToggle = document.getElementById('themeToggle');
            const toast = document.getElementById('toast');
            const toastProvince = document.getElementById('toastProvince');

            // ============================================
            // FUNGSI POPUP
            // ============================================
            function openPopup(url, name) {
                const width = Math.min(1100, window.screen.width - 40);
                const height = Math.min(750, window.screen.height - 40);
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;

                const popup = window.open(
                    url,
                    'cekpajak_' + Date.now(),
                    `width=${width},height=${height},left=${left},top=${top},scrollbars=yes,resizable=yes,menubar=no,toolbar=no,location=yes,status=no`
                );

                if (popup) {
                    popup.focus();
                    addHistory(url, name);
                    showToast('🪟', `Membuka ${name}`, 'Popup berhasil dibuka');
                } else {
                    alert('⚠️ Popup diblokir browser! Izinkan popup untuk website ini.');
                    showToast('⚠️', 'Popup diblokir!', 'Izinkan popup di browser Anda');
                }
            }

            // ============================================
            // RENDER GRID
            // ============================================
            function renderProvinces() {
                let filtered = provinces.filter(p =>
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.kode.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.kodeDesc.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (activeKode) {
                    filtered = filtered.filter(p =>
                        p.kode.includes(activeKode) ||
                        p.kode.split(',').some(k => k.trim() === activeKode)
                    );
                }

                if (filtered.length === 0) {
                    grid.innerHTML = `
                                <div style="grid-column:1/-1;text-align:center;padding:30px 20px;color:var(--text-secondary);">
                                    <div style="font-size:36px;margin-bottom:8px;">🔍</div>
                                    <p style="font-size:13px;opacity:0.6;">Tidak ditemukan</p>
                                </div>
                            `;
                    return;
                }

                grid.className = 'province-grid ' + (currentView === 'list' ? 'list-view' : '');

                grid.innerHTML = filtered.map(p => `
                            <div class="province-card" data-id="${p.id}">
                                <div class="card-header">
                                    <span class="emoji">${p.emoji}</span>
                                    <span class="name">${p.name}</span>
                                    <span class="badge">POPUP</span>
                                </div>
                                <div class="kode-nopol">
                                    <span class="label">📛</span>
                                    <span class="kode">${p.kode} <small>${p.kodeDesc}</small></span>
                                </div>
                                <div class="card-body">
                                    <div class="desc">${p.desc}</div>
                                </div>
                                <div class="card-footer">
                                    <button class="popup-btn" data-url="${p.url}" data-name="${p.name}">
                                        🪟 Buka
                                    </button>
                                    <span class="shortcut">⌨️ ${p.shortcut}</span>
                                </div>
                            </div>
                        `).join('');

                document.querySelectorAll('.popup-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        openPopup(this.dataset.url, this.dataset.name);
                    });
                });

                document.querySelectorAll('.province-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const btn = this.querySelector('.popup-btn');
                        if (btn) openPopup(btn.dataset.url, btn.dataset.name);
                    });
                });
            }

            // ============================================
            // RENDER FILTER KODE
            // ============================================
            function renderKodeFilter() {
                const allKodes = [];
                provinces.forEach(p => {
                    p.kode.split(',').map(k => k.trim()).forEach(k => {
                        if (!allKodes.includes(k)) allKodes.push(k);
                    });
                });
                allKodes.sort();

                kodeFilter.innerHTML = `
                            <span style="font-size:9px;color:var(--text-secondary);font-weight:600;margin-right:2px;">FILTER:</span>
                            <button class="kode-btn ${activeKode === '' ? 'active' : ''}" data-kode="">Semua</button>
                            ${allKodes.map(k => `
                                <button class="kode-btn ${activeKode === k ? 'active' : ''}" data-kode="${k}">${k}</button>
                            `).join('')}
                        `;

                kodeFilter.querySelectorAll('.kode-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        activeKode = this.dataset.kode;
                        renderKodeFilter();
                        renderProvinces();
                    });
                });
            }

            // ============================================
            // HISTORY
            // ============================================
            function addHistory(url, name) {
                const entry = { url, name, timestamp: new Date().toLocaleString('id-ID') };
                history = history.filter(h => h.url !== url);
                history.unshift(entry);
                if (history.length > 20) history.pop();
                localStorage.setItem('popupHistory', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">Belum ada riwayat.</div>';
                    return;
                }

                historyList.innerHTML = history.map((item, index) => `
                            <span class="chip" data-index="${index}" title="${item.timestamp}">
                                ${item.name || '❓'} 
                                <span class="remove" data-index="${index}">×</span>
                            </span>
                        `).join('');

                document.querySelectorAll('.history-list .chip').forEach(chip => {
                    chip.addEventListener('click', function(e) {
                        if (e.target.classList.contains('remove')) return;
                        const item = history[parseInt(this.dataset.index)];
                        if (item) openPopup(item.url, item.name);
                    });
                });

                document.querySelectorAll('.history-list .remove').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        history.splice(parseInt(this.dataset.index), 1);
                        localStorage.setItem('popupHistory', JSON.stringify(history));
                        renderHistory();
                    });
                });
            }

            // ============================================
            // TOAST
            // ============================================
            function showToast(icon, msg, sub) {
                clearTimeout(toastTimeout);
                toast.querySelector('.icon').textContent = icon;
                toast.querySelector('.msg').innerHTML = msg + (sub ? `<small>${sub}</small>` : '');
                toast.classList.add('show');
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ============================================
            // THEME
            // ============================================
            function applyTheme() {
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : '');
                themeToggle.textContent = darkMode ? '☀️' : '🌙';
                localStorage.setItem('darkModePopup', String(darkMode));
            }

            themeToggle.addEventListener('click', () => { darkMode = !darkMode;
                applyTheme(); });

            // ============================================
            // EVENT LISTENERS
            // ============================================
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderProvinces();
            });

            viewButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    viewButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentView = this.dataset.view;
                    renderProvinces();
                });
            });

            clearHistoryBtn.addEventListener('click', function() {
                if (confirm('Hapus semua riwayat?')) {
                    history = [];
                    localStorage.removeItem('popupHistory');
                    renderHistory();
                    showToast('🗑️', 'Riwayat dihapus', '');
                }
            });

            // ============================================
            // KEYBOARD SHORTCUT
            // ============================================
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;

                const map = {
                    '1': 0,
                    '2': 1,
                    '3': 2,
                    '4': 3,
                    '5': 4,
                    '6': 5,
                    '7': 6,
                    '8': 7,
                    '9': 8,
                    '0': 9,
                    'q': 10,
                    'w': 11,
                    'e': 12,
                    'r': 13
                };

                if (e.key in map) {
                    const p = provinces[map[e.key]];
                    if (p) {
                        openPopup(p.url, p.name);
                        e.preventDefault();
                        // Highlight card
                        document.querySelectorAll('.province-card').forEach((card, i) => {
                            if (i === map[e.key]) {
                                card.style.transform = 'scale(0.96)';
                                card.style.borderColor = '#302b63';
                                setTimeout(() => { card.style.transform = ''; }, 300);
                            }
                        });
                    }
                }
            });

            // ============================================
            // INIT
            // ============================================
            applyTheme();
            renderKodeFilter();
            renderProvinces();
            renderHistory();
            document.getElementById('totalProvinsi').textContent = provinces.length;

            console.log('🚗 Portal CekPajak.id - 14 Provinsi');
            console.log('⌨️ Shortcut: 1-9,0,q,w,e,r');

        })();
    </script>

</body>
</html>
