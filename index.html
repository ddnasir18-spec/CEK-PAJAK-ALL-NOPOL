<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 CekPajak.id - Portal Cek Pajak Kendaraan</title>
    <style>
        :root {
            --bg-primary: #f0f4f8;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --border-color: #e8edf2;
            --card-hover: #f8faff;
            --badge-playstore: #01875f;
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --border-color: #30363d;
            --card-hover: #1c2333;
            --header-gradient: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: var(--header-gradient);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .logo h1 { font-size: 20px; font-weight: 800; }
        .logo h1 span { font-weight: 300; opacity: 0.6; font-size: 14px; }
        .logo p { font-size: 11px; opacity: 0.7; }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .stats-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        .grid-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
            margin: 8px 0 6px 0;
        }

        .filter-label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .filter-label input {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 12px;
            width: 160px;
            height: 30px;
        }

        .kode-filter { display: flex; gap: 3px; flex-wrap: wrap; }
        .kode-btn {
            padding: 2px 10px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            height: 26px;
        }
        .kode-btn.active { background: var(--header-gradient); color: white; border-color: transparent; }

        .view-toggle { display: flex; gap: 4px; }
        .view-toggle button {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            height: 28px;
        }
        .view-toggle button.active { background: var(--header-gradient); color: white; border-color: transparent; }

        .province-grid-wrapper { flex: 1; min-height: 0; overflow: hidden; }

        .province-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            height: 100%;
            overflow-y: auto;
            padding-right: 4px;
        }

        .province-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }
        .province-card:hover { transform: translateY(-2px); border-color: #302b63; }

        .card-header { display: flex; align-items: center; gap: 10px; }
        .card-header .emoji { font-size: 24px; }
        .card-header .name { font-size: 14px; font-weight: 700; }

        .badge {
            font-size: 8px;
            padding: 1px 10px;
            border-radius: 20px;
            font-weight: 600;
            background: #28a745;
            color: white;
            margin-left: auto;
        }
        .badge-playstore { background: var(--badge-playstore); font-size: 7px; padding: 1px 8px; }

        .kode-nopol {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 6px 0;
            padding: 4px 12px;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
        .kode-nopol .label { font-size: 9px; font-weight: 600; color: var(--text-secondary); }
        .kode-nopol .kode {
            font-size: 16px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            background: var(--bg-card);
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .kode-nopol .kode small { font-size: 10px; font-weight: 400; color: var(--text-secondary); margin-left: 4px; }

        .desc { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
        .desc.warning { color: #e67e22; font-weight: 500; }

        .card-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-btn {
            background: var(--header-gradient);
            color: white;
            border: none;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn:hover { transform: scale(1.04); }
        .btn-playstore { background: var(--badge-playstore); }

        .shortcut { font-size: 10px; color: var(--text-secondary); opacity: 0.4; font-family: monospace; }

        .history-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 8px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-top: 6px;
            max-height: 60px;
            overflow: hidden;
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; }
        .history-header h3 { font-size: 12px; }
        .clear-btn { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 10px; }

        .history-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; max-height: 28px; overflow-y: auto; }
        .chip {
            background: var(--bg-primary);
            padding: 2px 12px;
            border-radius: 16px;
            font-size: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .chip .remove { color: #dc3545; font-weight: bold; margin-left: 4px; }
        .history-empty { color: var(--text-secondary); font-size: 11px; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast .msg { font-size: 13px; }
        .toast .msg small { display: block; font-size: 11px; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .province-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
            .province-card { padding: 10px 12px; }
            .card-header .name { font-size: 12px; }
            .kode-nopol .kode { font-size: 13px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>🚗 CekPajak<span>.id</span></h1>
            <p>19 Provinsi · Web & Play Store</p>
        </div>
        <div class="header-actions">
            <div class="stats-badge">📋 <span id="totalProvinsi">19</span></div>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </header>

    <div class="grid-controls">
        <div class="filter-label">
            🔍 <input type="text" id="searchInput" placeholder="Cari provinsi / kode...">
            <div class="kode-filter" id="kodeFilter"></div>
        </div>
        <div class="view-toggle">
            <button class="active" data-view="grid">📐 Grid</button>
            <button data-view="list">📋 Daftar</button>
        </div>
    </div>

    <div class="province-grid-wrapper">
        <div class="province-grid" id="provinceGrid"></div>
    </div>

    <div class="history-section">
        <div class="history-header">
            <h3>📜 Riwayat</h3>
            <button class="clear-btn" id="clearHistory">🗑️ Kosongkan</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">Belum ada riwayat.</div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span class="icon">📑</span>
        <div class="msg">Membuka tab baru...<small id="toastProvince">Provinsi</small></div>
    </div>

    <script>
        (function() {
            'use strict';

            const provinces = [
                { id: 1, name: 'DIY Sleman', emoji: '🟡', kode: 'AB', kodeDesc: 'Yogyakarta', url: 'https://samsatsleman.jogjaprov.go.id/cek/pajak', desc: 'Cek pajak kendaraan DIY Sleman', shortcut: '1', type: 'web' },
                { id: 2, name: 'Banten', emoji: '🟢', kode: 'A', kodeDesc: 'Tangerang, Serang', url: 'https://infopkb.bantenprov.go.id/index.php', desc: 'Informasi PKB Provinsi Banten', shortcut: '2', type: 'web' },
                { id: 3, name: 'DKI Jakarta', emoji: '🔵', kode: 'B', kodeDesc: 'Jakarta', url: 'https://samsat-pkb2.jakarta.go.id/', desc: 'Samsat PKB DKI Jakarta', shortcut: '3', type: 'web' },
                { id: 4, name: 'Jambi', emoji: '🟣', kode: 'BH', kodeDesc: 'Jambi', url: 'https://jambisamsat.net/infopkb.html', desc: 'Informasi PKB Provinsi Jambi', shortcut: '4', type: 'web' },
                { id: 5, name: 'Jawa Timur', emoji: '🔴', kode: 'L, M, N, P, S, W, AG', kodeDesc: 'Surabaya, Malang', url: 'https://bapenda.jatimprov.go.id/info/pkb', desc: 'Info pajak kendaraan Jawa Timur', shortcut: '5', type: 'web' },
                { id: 6, name: 'Lampung', emoji: '🟠', kode: 'BE', kodeDesc: 'Bandar Lampung', url: 'https://ipesat.bapenda.lampungprov.go.id/infopajak', desc: 'Informasi pajak SAMSAT Lampung', shortcut: '6', type: 'web' },
                { id: 7, name: 'Kalimantan Timur', emoji: '🟤', kode: 'KT', kodeDesc: 'Samarinda, Balikpapan', url: 'http://simpator.kaltimprov.go.id/cari.php', desc: 'Info pajak kendaraan Kaltim', shortcut: '7', type: 'web' },
                { id: 8, name: 'Riau', emoji: '🔷', kode: 'BM', kodeDesc: 'Pekanbaru', url: 'https://bapenda.riau.go.id/dashboard/layanan/infopajak', desc: 'Bapenda Riau - info pajak', shortcut: '8', type: 'web' },
                { id: 9, name: 'Jawa Barat', emoji: '🟦', kode: 'D, E, F, T, Z', kodeDesc: 'Bandung, Bekasi, Bogor', url: 'https://bapenda.jabarprov.go.id/infopkb/', desc: 'Info PKB Jawa Barat', shortcut: '9', type: 'web' },
                { id: 10, name: 'Sumatera Selatan', emoji: '🟩', kode: 'BG', kodeDesc: 'Palembang', url: 'https://ppid-bapenda.sumselprov.go.id/cekpajak#hasil', desc: 'Info pajak kendaraan Sumsel', shortcut: '0', type: 'web' },
                { id: 11, name: 'Kepulauan Riau', emoji: '🛳️', kode: 'BP', kodeDesc: 'Batam, Tanjungpinang', url: 'https://bapenda.kepriprov.go.id/info-pajak', desc: 'Info pajak kendaraan Kepri', shortcut: 'q', type: 'web' },
                { id: 12, name: 'Sulawesi Tengah', emoji: '🏔️', kode: 'DN', kodeDesc: 'Palu', url: 'https://bapenda.sultengprov.go.id/pkb', desc: 'Info pajak kendaraan Sulteng', shortcut: 'w', type: 'web' },
                { id: 13, name: 'Bengkulu', emoji: '🌴', kode: 'BD', kodeDesc: 'Bengkulu', url: 'https://pusako.bengkuluprov.go.id/infopajak', desc: 'Info pajak kendaraan Bengkulu', shortcut: 'e', type: 'web' },
                { id: 14, name: 'Sulawesi Utara', emoji: '🌊', kode: 'DB', kodeDesc: 'Manado', url: 'https://bapenda.sulutprov.go.id/cekpajak', desc: 'Info pajak kendaraan Sulut', shortcut: 'r', type: 'web' },
                { id: 15, name: 'Bali', emoji: '🌺', kode: 'DK', kodeDesc: 'Denpasar, Badung', url: 'https://portal.bpdbali.id/infosamsat/', desc: 'Info pajak kendaraan Bali', shortcut: 't', type: 'web' },
                { id: 16, name: 'Sumatera Utara', emoji: '🏝️', kode: 'BK', kodeDesc: 'Medan, Deli Serdang', url: 'https://bapenda.sumutprov.go.id/website/cek-pajak', desc: 'Info pajak kendaraan Sumut', shortcut: 'y', type: 'web' },
                { id: 17, name: 'Sulawesi Selatan', emoji: '🦐', kode: 'DD, DP, DW', kodeDesc: 'Makassar, Parepare', url: 'https://play.google.com/store/apps/details?id=id.go.sulsel.bapenda.basulmobile&hl=id', desc: '⚠️ Cek via web belum tersedia. Gunakan aplikasi Basul Mobile.', shortcut: 'u', type: 'playstore' },
                { id: 18, name: 'Jawa Tengah', emoji: '🏛️', kode: 'H, AA, AD, R, K, G', kodeDesc: 'Semarang, Solo, Pekalongan', url: 'https://play.google.com/store/apps/details?id=com.jatengprov.bapenda.newsakpole&hl=id', desc: '⚠️ Cek via web belum tersedia. Gunakan aplikasi New Sakpole.', shortcut: 'i', type: 'playstore' },
                { id: 19, name: 'Kalimantan Utara', emoji: '🌲', kode: 'KU', kodeDesc: 'Tarakan, Bulungan, Nunukan', url: 'https://play.google.com/store/apps/details?id=bapenda.kaltaraprov.esamsatku&hl=id', desc: '⚠️ Cek via web belum tersedia. Gunakan aplikasi eSamsatku.', shortcut: 'o', type: 'playstore' }
            ];

            let currentView = 'grid';
            let searchQuery = '';
            let activeKode = '';
            let history = JSON.parse(localStorage.getItem('tabHistory') || '[]');
            let darkMode = localStorage.getItem('darkModeTab') === 'true';
            let toastTimeout = null;

            const grid = document.getElementById('provinceGrid');
            const searchInput = document.getElementById('searchInput');
            const kodeFilter = document.getElementById('kodeFilter');
            const viewButtons = document.querySelectorAll('.view-toggle button');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistory');
            const themeToggle = document.getElementById('themeToggle');
            const toast = document.getElementById('toast');

            function openInNewTab(url, name, type) {
                const newTab = window.open(url, '_blank');
                if (newTab) {
                    newTab.focus();
                    addHistory(url, name);
                    showToast(type === 'playstore' ? '📱' : '📑', `Membuka ${name}`, type === 'playstore' ? 'Download aplikasi resmi' : 'Tab baru');
                } else {
                    window.location.href = url;
                }
            }

            function renderProvinces() {
                let filtered = provinces.filter(p =>
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.kode.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.kodeDesc.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (activeKode) {
                    filtered = filtered.filter(p =>
                        p.kode.includes(activeKode) ||
                        p.kode.split(',').some(k => k.trim() === activeKode)
                    );
                }

                if (filtered.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;">🔍 Tidak ditemukan</div>`;
                    return;
                }

                grid.className = 'province-grid ' + (currentView === 'list' ? 'list-view' : '');

                grid.innerHTML = filtered.map(p => {
                    const isPlaystore = p.type === 'playstore';
                    const badgeClass = isPlaystore ? 'badge badge-playstore' : 'badge';
                    const badgeText = isPlaystore ? '📱 PLAY STORE' : 'TAB';
                    const btnClass = isPlaystore ? 'tab-btn btn-playstore' : 'tab-btn';
                    const btnText = isPlaystore ? '📱 Download' : '📑 Buka Tab';
                    const descClass = isPlaystore ? 'desc warning' : 'desc';

                    return `
                        <div class="province-card" data-id="${p.id}">
                            <div class="card-header">
                                <span class="emoji">${p.emoji}</span>
                                <span class="name">${p.name}</span>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="kode-nopol">
                                <span class="label">📛</span>
                                <span class="kode">${p.kode} <small>${p.kodeDesc}</small></span>
                            </div>
                            <div class="card-body">
                                <div class="${descClass}">${p.desc}</div>
                            </div>
                            <div class="card-footer">
                                <button class="${btnClass}" data-url="${p.url}" data-name="${p.name}" data-type="${p.type}">
                                    ${btnText}
                                </button>
                                <span class="shortcut">⌨️ ${p.shortcut}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        openInNewTab(this.dataset.url, this.dataset.name, this.dataset.type);
                    });
                });

                document.querySelectorAll('.province-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const btn = this.querySelector('.tab-btn');
                        if (btn) openInNewTab(btn.dataset.url, btn.dataset.name, btn.dataset.type);
                    });
                });
            }

            function renderKodeFilter() {
                const allKodes = [];
                provinces.forEach(p => {
                    p.kode.split(',').map(k => k.trim()).forEach(k => {
                        if (!allKodes.includes(k)) allKodes.push(k);
                    });
                });
                allKodes.sort();

                kodeFilter.innerHTML = `
                    <span style="font-size:9px;font-weight:600;">FILTER:</span>
                    <button class="kode-btn ${activeKode === '' ? 'active' : ''}" data-kode="">Semua</button>
                    ${allKodes.map(k => `<button class="kode-btn ${activeKode === k ? 'active' : ''}" data-kode="${k}">${k}</button>`).join('')}
                `;

                kodeFilter.querySelectorAll('.kode-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        activeKode = this.dataset.kode;
                        renderKodeFilter();
                        renderProvinces();
                    });
                });
            }

            function addHistory(url, name) {
                const entry = { url, name, timestamp: new Date().toLocaleString('id-ID') };
                history = history.filter(h => h.url !== url);
                history.unshift(entry);
                if (history.length > 20) history.pop();
                localStorage.setItem('tabHistory', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">Belum ada riwayat.</div>';
                    return;
                }
                historyList.innerHTML = history.map((item, index) => `
                    <span class="chip" data-index="${index}" title="${item.timestamp}">
                        ${item.name} <span class="remove" data-index="${index}">×</span>
                    </span>
                `).join('');

                document.querySelectorAll('.chip').forEach(chip => {
                    chip.addEventListener('click', function(e) {
                        if (e.target.classList.contains('remove')) return;
                        const item = history[parseInt(this.dataset.index)];
                        if (item) openInNewTab(item.url, item.name);
                    });
                });

                document.querySelectorAll('.remove').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        history.splice(parseInt(this.dataset.index), 1);
                        localStorage.setItem('tabHistory', JSON.stringify(history));
                        renderHistory();
                    });
                });
            }

            function showToast(icon, msg, sub) {
                clearTimeout(toastTimeout);
                toast.querySelector('.icon').textContent = icon;
                toast.querySelector('.msg').innerHTML = msg + (sub ? `<small>${sub}</small>` : '');
                toast.classList.add('show');
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : '');
                themeToggle.textContent = darkMode ? '☀️' : '🌙';
                localStorage.setItem('darkModeTab', String(darkMode));
            }

            themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });

            searchInput.addEventListener('input', function() { searchQuery = this.value; renderProvinces(); });

            viewButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    viewButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentView = this.dataset.view;
                    renderProvinces();
                });
            });

            clearHistoryBtn.addEventListener('click', function() {
                if (confirm('Hapus semua riwayat?')) {
                    history = [];
                    localStorage.removeItem('tabHistory');
                    renderHistory();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                const map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '8': 7, '9': 8, '0': 9, 'q': 10, 'w': 11, 'e': 12, 'r': 13, 't': 14, 'y': 15, 'u': 16, 'i': 17, 'o': 18 };
                if (e.key in map) {
                    const p = provinces[map[e.key]];
                    if (p) { openInNewTab(p.url, p.name, p.type); e.preventDefault(); }
                }
            });

            applyTheme();
            renderKodeFilter();
            renderProvinces();
            renderHistory();
            document.getElementById('totalProvinsi').textContent = provinces.length;

        })();
    </script>
</body>
</html>
