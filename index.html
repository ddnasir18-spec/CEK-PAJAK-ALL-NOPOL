<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Portal Cek Pajak - Popup Mode</title>
    <style>
        /* ============================================
                   CSS VARIABLES & RESET
                ============================================ */
        :root {
            --bg-primary: #f0f4f8;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --header-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --border-color: #e8edf2;
            --card-hover: #f8faff;
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            --border-color: #30363d;
            --card-hover: #1c2333;
            --header-gradient: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            padding: 20px;
        }

        /* ============================================
                   HEADER
                ============================================ */
        .header {
            background: var(--header-gradient);
            color: white;
            padding: 24px 30px;
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
            pointer-events: none;
        }

        .logo {
            position: relative;
            z-index: 1;
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo h1 span {
            font-weight: 300;
            opacity: 0.6;
            font-size: 18px;
        }

        .logo p {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 2px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(20deg) scale(1.05);
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge span {
            font-weight: 700;
        }

        /* ============================================
                   GRID PROVINSI
                ============================================ */
        .grid-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-controls .filter-label {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-controls .filter-label input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            width: 200px;
            transition: var(--transition);
            outline: none;
        }

        .grid-controls .filter-label input:focus {
            border-color: #302b63;
            box-shadow: 0 0 0 3px rgba(48, 43, 99, 0.15);
        }

        .grid-controls .view-toggle {
            display: flex;
            gap: 6px;
        }

        .grid-controls .view-toggle button {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
        }

        .grid-controls .view-toggle button.active {
            background: var(--header-gradient);
            color: white;
            border-color: transparent;
        }

        .grid-controls .view-toggle button:hover:not(.active) {
            border-color: var(--text-primary);
        }

        /* ============================================
                   PROVINCE GRID
                ============================================ */
        .province-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .province-grid.list-view {
            grid-template-columns: 1fr;
        }

        .province-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .province-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
            border-color: #302b63;
        }

        .province-card:active {
            transform: scale(0.98);
        }

        .province-card .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .province-card .card-header .emoji {
            font-size: 36px;
            line-height: 1;
        }

        .province-card .card-header .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .province-card .card-header .badge {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: #e8f0fe;
            color: #1a73e8;
            margin-left: auto;
        }

        [data-theme="dark"] .province-card .card-header .badge {
            background: #1a2332;
            color: #58a6ff;
        }

        .province-card .card-body {
            flex: 1;
        }

        .province-card .card-body .url {
            font-size: 12px;
            color: var(--text-secondary);
            word-break: break-all;
            opacity: 0.7;
            font-family: monospace;
            margin-bottom: 10px;
        }

        .province-card .card-body .desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .province-card .card-footer {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .province-card .card-footer .popup-btn {
            background: var(--header-gradient);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .province-card .card-footer .popup-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(48, 43, 99, 0.3);
        }

        .province-card .card-footer .popup-btn:active {
            transform: scale(0.96);
        }

        .province-card .card-footer .shortcut {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.5;
            font-family: monospace;
        }

        /* ============================================
                   HISTORY
                ============================================ */
        .history-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-header h3 {
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .history-header .clear-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .history-header .clear-btn:hover {
            background: rgba(220, 53, 69, 0.08);
        }

        .history-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            max-height: 52px;
            overflow-y: auto;
        }

        .history-list .chip {
            background: var(--bg-primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-list .chip:hover {
            border-color: #302b63;
            transform: scale(1.04);
        }

        .history-list .chip .remove {
            color: #dc3545;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .history-list .chip .remove:hover {
            transform: scale(1.3);
        }

        .history-empty {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
            opacity: 0.6;
        }

        /* ============================================
                   FOOTER
                ============================================ */
        .footer {
            text-align: center;
            padding: 18px 20px;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 12px;
            opacity: 0.6;
            border-top: 1px solid var(--border-color);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--text-primary);
        }

        /* ============================================
                   TOAST NOTIFICATION
                ============================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast .icon {
            font-size: 24px;
        }

        .toast .msg {
            font-size: 14px;
            color: var(--text-primary);
        }

        .toast .msg small {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* ============================================
                   RESPONSIVE
                ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 18px 20px;
                flex-direction: column;
                text-align: center;
            }

            .logo h1 {
                font-size: 20px;
                justify-content: center;
            }

            .logo h1 span {
                font-size: 14px;
            }

            .logo p {
                font-size: 11px;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .stats-badge {
                font-size: 11px;
                padding: 6px 14px;
            }

            .province-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .province-card {
                padding: 18px 16px;
            }

            .province-card .card-header .emoji {
                font-size: 28px;
            }

            .province-card .card-header .name {
                font-size: 15px;
            }

            .province-card .card-footer .popup-btn {
                font-size: 11px;
                padding: 6px 14px;
            }

            .grid-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .grid-controls .filter-label input {
                width: 100%;
            }

            .history-list {
                max-height: 40px;
            }
        }

        @media (max-width: 480px) {
            .province-grid {
                grid-template-columns: 1fr;
            }

            .province-card .card-header .badge {
                font-size: 8px;
                padding: 1px 8px;
            }

            .toast {
                left: 16px;
                right: 16px;
                bottom: 16px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    HEADER
    ============================================ -->
    <header class="header">
        <div class="logo">
            <h1>
                🚗 CekPajak<span>.id</span>
            </h1>
            <p>Portal Cepat Pajak Kendaraan • 10 Provinsi</p>
        </div>
        <div class="header-actions">
            <div class="stats-badge">
                📋 <span id="totalProvinsi">10</span> Provinsi
            </div>
            <button class="theme-toggle" id="themeToggle" title="Ganti Tema">🌙</button>
        </div>
    </header>

    <!-- ============================================
    GRID CONTROLS
    ============================================ -->
    <div class="grid-controls">
        <div class="filter-label">
            🔍 Cari provinsi
            <input type="text" id="searchInput" placeholder="Ketik nama provinsi...">
        </div>
        <div class="view-toggle">
            <button class="active" data-view="grid">📐 Grid</button>
            <button data-view="list">📋 Daftar</button>
        </div>
    </div>

    <!-- ============================================
    PROVINCE GRID
    ============================================ -->
    <div class="province-grid" id="provinceGrid">
        <!-- Akan diisi oleh JavaScript -->
    </div>

    <!-- ============================================
    HISTORY
    ============================================ -->
    <div class="history-section">
        <div class="history-header">
            <h3>📜 Riwayat Popup</h3>
            <button class="clear-btn" id="clearHistory">🗑️ Kosongkan</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">Belum ada riwayat.</div>
        </div>
    </div>

    <!-- ============================================
    TOAST
    ============================================ -->
    <div class="toast" id="toast">
        <span class="icon">🪟</span>
        <div class="msg">
            Membuka popup...
            <small id="toastProvince">Provinsi</small>
        </div>
    </div>

    <!-- ============================================
    FOOTER
    ============================================ -->
    <footer class="footer">
        <p>
            © 2026 CekPajak.id · Dibuat dengan ❤️ · 
            Semua data dari website resmi SAMSAT Provinsi
        </p>
    </footer>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================
            // DATA PROVINSI (SEMUA POPUP)
            // ============================================
            const provinces = [{
                id: 1,
                name: 'DIY Sleman',
                emoji: '🟡',
                url: 'https://samsatsleman.jogjaprov.go.id/cek/pajak',
                desc: 'Cek pajak kendaraan DIY Sleman',
                shortcut: '1'
            }, {
                id: 2,
                name: 'Banten',
                emoji: '🟢',
                url: 'https://infopkb.bantenprov.go.id/index.php',
                desc: 'Informasi PKB Provinsi Banten',
                shortcut: '2'
            }, {
                id: 3,
                name: 'DKI Jakarta',
                emoji: '🔵',
                url: 'https://samsat-pkb2.jakarta.go.id/',
                desc: 'Samsat PKB DKI Jakarta (dengan CAPTCHA)',
                shortcut: '3'
            }, {
                id: 4,
                name: 'Jambi',
                emoji: '🟣',
                url: 'https://jambisamsat.net/infopkb.html',
                desc: 'Informasi PKB Provinsi Jambi',
                shortcut: '4'
            }, {
                id: 5,
                name: 'Jawa Timur',
                emoji: '🔴',
                url: 'https://bapenda.jatimprov.go.id/info/pkb',
                desc: 'Info pajak kendaraan Jawa Timur',
                shortcut: '5'
            }, {
                id: 6,
                name: 'Lampung',
                emoji: '🟠',
                url: 'https://ipesat.bapenda.lampungprov.go.id/infopajak',
                desc: 'Informasi pajak SAMSAT Lampung',
                shortcut: '6'
            }, {
                id: 7,
                name: 'Kalimantan Timur',
                emoji: '🟤',
                url: 'http://simpator.kaltimprov.go.id/cari.php',
                desc: 'Info pajak kendaraan Kaltim',
                shortcut: '7'
            }, {
                id: 8,
                name: 'Riau',
                emoji: '🔷',
                url: 'https://bapenda.riau.go.id/dashboard/layanan/infopajak',
                desc: 'Bapenda Riau - layanan info pajak',
                shortcut: '8'
            }, {
                id: 9,
                name: 'Jawa Barat',
                emoji: '🟦',
                url: 'https://bapenda.jabarprov.go.id/infopkb/',
                desc: 'Info PKB Jawa Barat - Bapenda Jabar',
                shortcut: '9'
            }, {
                id: 10,
                name: 'Sumatera Selatan',
                emoji: '🟩',
                url: 'https://bapenda.sumselprov.go.id/infopajak',
                desc: 'Info pajak kendaraan Sumsel',
                shortcut: '0'
            }];

            // ============================================
            // STATE
            // ============================================
            let currentView = 'grid';
            let searchQuery = '';
            let history = JSON.parse(localStorage.getItem('popupHistory') || '[]');
            let darkMode = localStorage.getItem('darkModePopup') === 'true';
            let toastTimeout = null;

            // ============================================
            // DOM REFS
            // ============================================
            const grid = document.getElementById('provinceGrid');
            const searchInput = document.getElementById('searchInput');
            const viewButtons = document.querySelectorAll('.view-toggle button');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistory');
            const themeToggle = document.getElementById('themeToggle');
            const toast = document.getElementById('toast');
            const toastProvince = document.getElementById('toastProvince');

            // ============================================
            // FUNGSI POPUP
            // ============================================
            function openPopup(url, name) {
                // Popup settings
                const width = Math.min(1200, window.screen.width - 40);
                const height = Math.min(800, window.screen.height - 40);
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;

                const popup = window.open(
                    url,
                    'cekpajak_' + Date.now(),
                    `width=${width},height=${height},left=${left},top=${top},scrollbars=yes,resizable=yes,menubar=no,toolbar=no,location=yes,status=no`
                );

                if (popup) {
                    popup.focus();
                    // Tambah riwayat
                    addHistory(url, name);
                    showToast('🪟', `Membuka ${name}`, 'Popup berhasil dibuka');
                } else {
                    alert('⚠️ Popup diblokir browser! Izinkan popup untuk website ini.\n\nAtau klik kanan link → Buka di tab baru.');
                    showToast('⚠️', 'Popup diblokir!', 'Izinkan popup di browser Anda');
                }
            }

            // ============================================
            // RENDER GRID
            // ============================================
            function renderProvinces() {
                const filtered = provinces.filter(p =>
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.desc.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (filtered.length === 0) {
                    grid.innerHTML = `
                                <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-secondary);">
                                    <div style="font-size:48px;margin-bottom:16px;">🔍</div>
                                    <h3 style="font-weight:400;">Tidak ditemukan</h3>
                                    <p style="font-size:14px;opacity:0.6;">Coba kata kunci lain</p>
                                </div>
                            `;
                    return;
                }

                grid.className = 'province-grid ' + (currentView === 'list' ? 'list-view' : '');

                grid.innerHTML = filtered.map(p => `
                            <div class="province-card" data-id="${p.id}">
                                <div class="card-header">
                                    <span class="emoji">${p.emoji}</span>
                                    <span class="name">${p.name}</span>
                                    <span class="badge">POPUP</span>
                                </div>
                                <div class="card-body">
                                    <div class="url">${p.url.replace(/^https?:\/\//, '')}</div>
                                    <div class="desc">${p.desc}</div>
                                </div>
                                <div class="card-footer">
                                    <button class="popup-btn" data-url="${p.url}" data-name="${p.name}">
                                        🪟 Buka Popup
                                    </button>
                                    <span class="shortcut">⌨️ ${p.shortcut}</span>
                                </div>
                            </div>
                        `).join('');

                // Event listener untuk tombol popup
                document.querySelectorAll('.popup-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const url = this.dataset.url;
                        const name = this.dataset.name;
                        openPopup(url, name);
                    });
                });

                // Event listener untuk card (klik card = buka popup)
                document.querySelectorAll('.province-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const btn = this.querySelector('.popup-btn');
                        if (btn) {
                            const url = btn.dataset.url;
                            const name = btn.dataset.name;
                            openPopup(url, name);
                        }
                    });
                });
            }

            // ============================================
            // HISTORY
            // ============================================
            function addHistory(url, name) {
                const entry = { url, name, timestamp: new Date().toLocaleString('id-ID') };
                history = history.filter(h => h.url !== url);
                history.unshift(entry);
                if (history.length > 30) history.pop();
                localStorage.setItem('popupHistory', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">Belum ada riwayat.</div>';
                    return;
                }

                historyList.innerHTML = history.map((item, index) => `
                            <span class="chip" data-index="${index}" title="${item.timestamp}">
                                ${item.name || '❓'} 
                                <span class="remove" data-index="${index}">×</span>
                            </span>
                        `).join('');

                // Klik chip = buka popup
                document.querySelectorAll('.history-list .chip').forEach(chip => {
                    chip.addEventListener('click', function(e) {
                        if (e.target.classList.contains('remove')) return;
                        const index = parseInt(this.dataset.index);
                        const item = history[index];
                        if (item) {
                            openPopup(item.url, item.name);
                        }
                    });
                });

                // Tombol hapus per item
                document.querySelectorAll('.history-list .remove').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const index = parseInt(this.dataset.index);
                        history.splice(index, 1);
                        localStorage.setItem('popupHistory', JSON.stringify(history));
                        renderHistory();
                    });
                });
            }

            // ============================================
            // TOAST
            // ============================================
            function showToast(icon, msg, sub) {
                clearTimeout(toastTimeout);
                toast.querySelector('.icon').textContent = icon;
                toast.querySelector('.msg').innerHTML = msg + (sub ? `<small>${sub}</small>` : '');
                toast.classList.add('show');

                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ============================================
            // THEME
            // ============================================
            function applyTheme() {
                if (darkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '☀️';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    themeToggle.textContent = '🌙';
                }
                localStorage.setItem('darkModePopup', String(darkMode));
            }

            themeToggle.addEventListener('click', function() {
                darkMode = !darkMode;
                applyTheme();
            });

            // ============================================
            // SEARCH
            // ============================================
            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                renderProvinces();
            });

            // ============================================
            // VIEW TOGGLE
            // ============================================
            viewButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    viewButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentView = this.dataset.view;
                    renderProvinces();
                });
            });

            // ============================================
            // CLEAR HISTORY
            // ============================================
            clearHistoryBtn.addEventListener('click', function() {
                if (confirm('Hapus semua riwayat popup?')) {
                    history = [];
                    localStorage.removeItem('popupHistory');
                    renderHistory();
                    showToast('🗑️', 'Riwayat dihapus', 'Semua riwayat telah dibersihkan');
                }
            });

            // ============================================
            // KEYBOARD SHORTCUT (1-9, 0)
            // ============================================
            document.addEventListener('keydown', function(e) {
                // Abaikan jika sedang di input
                if (e.target.tagName === 'INPUT') return;

                const key = e.key;
                const shortcutMap = {
                    '1': 0,
                    '2': 1,
                    '3': 2,
                    '4': 3,
                    '5': 4,
                    '6': 5,
                    '7': 6,
                    '8': 7,
                    '9': 8,
                    '0': 9
                };

                if (key in shortcutMap) {
                    const index = shortcutMap[key];
                    if (provinces[index]) {
                        const p = provinces[index];
                        openPopup(p.url, p.name);
                        e.preventDefault();

                        // Highlight card
                        document.querySelectorAll('.province-card').forEach((card, i) => {
                            card.style.transition = 'all 0.2s';
                            if (i === index) {
                                card.style.transform = 'scale(0.96)';
                                card.style.borderColor = '#302b63';
                                setTimeout(() => {
                                    card.style.transform = '';
                                }, 300);
                            } else {
                                card.style.borderColor = '';
                            }
                        });
                    }
                }
            });

            // ============================================
            // INIT
            // ============================================
            applyTheme();
            renderProvinces();
            renderHistory();

            // Update total provinsi
            document.getElementById('totalProvinsi').textContent = provinces.length;

            console.log('🚗 Portal CekPajak.id - Popup Mode');
            console.log('📋 ' + provinces.length + ' provinsi tersedia');
            console.log('⌨️ Shortcut: 1-9,0 untuk buka popup cepat');
            console.log('🌙 Klik tombol bulan/matahari untuk ganti tema');

        })();
    </script>

</body>
</html>
